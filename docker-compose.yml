services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arus
      POSTGRES_PASSWORD: arus
      POSTGRES_DB: arus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arus -d arus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NUXT_DATABASE_URL: postgres://arus:arus@postgres:5432/arus
      DATABASE_URL: postgres://arus:arus@postgres:5432/arus
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-change-me-to-a-long-random-string-at-least-32}
      NUXT_AI_ENCRYPTION_KEY: ${NUXT_AI_ENCRYPTION_KEY:-change-me-to-another-long-random-string}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-http://localhost:3000}
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      MIGRATIONS_DIR: /app/server/database/migrations
    ports:
      - "3000:3000"

volumes:
  postgres_data:
